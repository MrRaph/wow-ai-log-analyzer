<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Passwort für {{ app_name }} zurücksetzen</title>
</head>
<body style="font-family: system-ui, sans-serif; background:#0b0d10; color:#e5e7eb; padding:24px;">
  <div style="max-width:560px;margin:0 auto;background:#11161c;border:1px solid #1f2933;border-radius:12px;padding:32px;">
    <h1 style="margin:0 0 16px 0;font-size:22px;color:#fbbf24;">Passwort zurücksetzen</h1>
    <p>Hallo {{ user_name }}, jemand (hoffentlich du) hat einen Passwort-Reset für {{ app_name }} angefordert.</p>
    <p>Der Link ist 1 Stunde gültig. Falls du das nicht warst, ignoriere diese Mail einfach — dein Passwort bleibt unverändert.</p>
    <p style="margin:24px 0;">
      <a href="{{ public_base_url }}/de/reset-password?token={{ token }}"
         style="display:inline-block;background:#f59e0b;color:#0b0d10;font-weight:600;padding:12px 20px;border-radius:8px;text-decoration:none;">
        Passwort zurücksetzen
      </a>
    </p>
  </div>
</body>
</html>
