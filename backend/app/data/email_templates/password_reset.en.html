<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Reset your {{ app_name }} password</title>
</head>
<body style="font-family: system-ui, sans-serif; background:#0b0d10; color:#e5e7eb; padding:24px;">
  <div style="max-width:560px;margin:0 auto;background:#11161c;border:1px solid #1f2933;border-radius:12px;padding:32px;">
    <h1 style="margin:0 0 16px 0;font-size:22px;color:#fbbf24;">Password reset</h1>
    <p>Hi {{ user_name }}, somebody (hopefully you) requested a password reset for {{ app_name }}.</p>
    <p>The link below is valid for 1 hour. If you did not request this, you can ignore this email — your password will not change.</p>
    <p style="margin:24px 0;">
      <a href="{{ public_base_url }}/en/reset-password?token={{ token }}"
         style="display:inline-block;background:#f59e0b;color:#0b0d10;font-weight:600;padding:12px 20px;border-radius:8px;text-decoration:none;">
        Reset password
      </a>
    </p>
  </div>
</body>
</html>
