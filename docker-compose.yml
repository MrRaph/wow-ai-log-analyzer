name: wow-ai-log-analyzer

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-UTC}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - "6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Optional Docker socket mount for the admin "System" card
    # (ADMIN_DOCKER_CONTROL=true). Equivalent to root on the host —
    # only enable on single-tenant self-hosted instances. The mount
    # itself is harmless when ADMIN_DOCKER_CONTROL=false (the service
    # never reads the socket).
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      # Bind only to loopback so the reverse proxy on the host (Caddy/nginx)
      # can reach it but nothing on the public internet can.
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health'); sys.exit(0)"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: redis
    command: ["uv", "run", "arq", "app.workers.arq_app.WorkerSettings"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
        NEXT_PUBLIC_DEFAULT_LOCALE: ${NEXT_PUBLIC_DEFAULT_LOCALE:-en}
        NEXT_PUBLIC_IMPRINT_NAME: ${NEXT_PUBLIC_IMPRINT_NAME:-}
        NEXT_PUBLIC_IMPRINT_STREET: ${NEXT_PUBLIC_IMPRINT_STREET:-}
        NEXT_PUBLIC_IMPRINT_POSTAL_CITY: ${NEXT_PUBLIC_IMPRINT_POSTAL_CITY:-}
        NEXT_PUBLIC_IMPRINT_COUNTRY: ${NEXT_PUBLIC_IMPRINT_COUNTRY:-Deutschland}
        NEXT_PUBLIC_IMPRINT_EMAIL: ${NEXT_PUBLIC_IMPRINT_EMAIL:-}
        NEXT_PUBLIC_IMPRINT_PHONE: ${NEXT_PUBLIC_IMPRINT_PHONE:-}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"

  # Optional: locally hosted OpenAI-compatible LLM server (llama.cpp). Only
  # starts when explicitly requested:
  #   docker compose --profile local-ai up -d
  # Requires NVIDIA Container Toolkit + driver on the host.
  #
  # We use llama.cpp's official upstream server-cuda image (Ollama lags
  # behind on bleeding-edge model architectures, e.g. qwen35moe) and wrap
  # it with a small Python supervisor so the backend can switch models,
  # delete cached GGUFs and stop inference WITHOUT needing Docker socket
  # access. The supervisor persists its config in /cache so admin changes
  # survive container restarts.
  local-ai:
    profiles: ["local-ai"]
    build:
      context: ./local-ai
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      HF_TOKEN: ${HUGGINGFACE_TOKEN:-}
      LLAMA_CACHE: /cache
      # Initial defaults — the supervisor seeds its persisted state from
      # these on first boot. Once an admin saves config in the UI the
      # /cache/supervisor-state.json file overrides them on subsequent
      # boots.
      LOCAL_AI_HF_REPO: ${LOCAL_AI_HF_REPO:-}
      LOCAL_AI_HF_FILE: ${LOCAL_AI_HF_FILE:-}
      LOCAL_AI_MODEL: ${LOCAL_AI_MODEL:-local-llm}
      LOCAL_AI_CTX_SIZE: ${LOCAL_AI_CTX_SIZE:-16384}
      LOCAL_AI_ENABLE_THINKING: ${LOCAL_AI_ENABLE_THINKING:-true}
      # The :server-cuda image ships the CUDA backend at /app/libggml-cuda.so
      # but doesn't set LD_LIBRARY_PATH for it, so the runtime dlopen falls
      # back to "no usable GPU found". Make the dependent libs reachable:
      LD_LIBRARY_PATH: /app:/usr/local/cuda/lib64
    volumes:
      - llama-cache:/cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]
    expose:
      - "8080"  # llama-server inference (managed by supervisor)
      - "8081"  # supervisor management API
    healthcheck:
      # The supervisor responds on :8081 even while the model is still
      # downloading or the child is stopped — that's the right liveness
      # signal here. /v1/models on :8080 only goes 200 once a model is
      # loaded, which can be 10-40 min after first boot.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8081 && echo -e 'GET /healthz HTTP/1.1\\r\\nHost: x\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  postgres-data:
  redis-data:
  llama-cache:
